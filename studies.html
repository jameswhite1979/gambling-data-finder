<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Datasets — Gambling Data Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=6">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="canonical" href="https://www.gamblingdatafinder.com/studies.html">
<meta name="description" content="Browse all studies and datasets holding gambling data on children and young people.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gambling Data Finder">
<meta property="og:title" content="All Datasets — Gambling Data Finder">
<meta property="og:description" content="Browse all studies and datasets holding gambling data on children and young people.">
<meta property="og:url" content="https://www.gamblingdatafinder.com/studies.html">
<meta property="og:image" content="https://www.gamblingdatafinder.com/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="header"></div>

<div id="main-content" class="page-content">
  <div class="section-header-row" style="margin-bottom:.3rem">
    <h1 style="font-size:1.4rem;color:var(--navy);">All studies and datasets</h1>
    <a href="compare.html" class="show-more">Compare studies &rarr;</a>
  </div>
  <p style="color:var(--text-muted);margin-bottom:1.5rem;font-size:.9rem;" id="studies-summary"></p>

  <div class="studies-grid" id="studies-grid" aria-live="polite">
    <div class="loading">Loading datasets...</div>
  </div>
</div>

<div id="footer"></div>
<script src="app.js?v=7"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('header').innerHTML = renderNav('');
  document.getElementById('footer').innerHTML = renderFooter();
  updateBasketCount();

  // Per-study counts come from the small precomputed study_stats.json
  const [datasets, stats, summary] = await Promise.all([
    fetchJSON('data/datasets.json'),
    fetchJSON('data/study_stats.json'),
    fetchJSON('data/summary.json'),
  ]);

  const grid = document.getElementById('studies-grid');
  grid.innerHTML = '';

  if (!datasets || datasets.length === 0) {
    grid.innerHTML = '<p>No datasets found.</p>';
    return;
  }

  document.getElementById('studies-summary').textContent =
    `${datasets.length} studies and datasets with ${((summary && summary.variables) || 0).toLocaleString()} variables indexed for CYP-GHRIP evidence mapping`;

  const varCounts = {};
  const gambCounts = {};
  if (stats) {
    Object.keys(stats).forEach(id => {
      varCounts[id] = stats[id].variables || 0;
      gambCounts[id] = stats[id].gambling || 0;
    });
  }

  const sorted = datasets
    .filter(d => d['Dataset_ID'] || d['Dataset name'])
    .sort((a, b) => (a['Dataset name']||'').localeCompare(b['Dataset name']||''));

  sorted.forEach(d => {
    const id = d['Dataset_ID'] || d['Dataset name'];
    const name = d['Dataset name'] || id;
    const country = d['Country'] || '';
    const age = d['Age focus / population'] || '';
    const design = d['Study design'] || '';
    const nVars = varCounts[id] || 0;
    const nGamb = gambCounts[id] || 0;
    const accessType = d['Access type'] || d['Access difficulty'] || '';

    const card = document.createElement('a');
    card.href = `study.html?id=${encodeURIComponent(id)}`;
    card.className = 'study-card';
    card.innerHTML = `
      <div class="study-card-id">${escapeHTML(id)}</div>
      <div class="study-card-name">${escapeHTML(name)}</div>
      <div class="study-card-meta">${escapeHTML(country)}${design ? ' · ' + escapeHTML(design) : ''}${age ? ' · ' + escapeHTML(age) : ''}</div>
      <div class="study-card-stats">
        <span class="study-card-stat">${nVars.toLocaleString()} variables</span>
        ${nGamb ? `<span class="study-card-stat">${nGamb.toLocaleString()} gambling</span>` : ''}
        ${accessType ? `<span class="study-card-stat" style="color:var(--text-muted);">${escapeHTML(truncate(accessType, 25))}</span>` : ''}
      </div>`;
    grid.appendChild(card);
  });
});
</script>
</body>
</html>
