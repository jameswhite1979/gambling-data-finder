name: Validate data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON data and cross-references
        run: python scripts/validate_and_update.py HSE --data-dir data

      - name: Check for mojibake in data files
        run: |
          if grep -rlP '\xc3\xa2\xe2\x82\xac|\xc3\x83\xc2' data/*.json; then
            echo "::error::Mojibake byte sequences found in data files (see list above)"
            exit 1
          fi
          echo "No mojibake found"

      - name: Fail if validation changed derived files
        run: |
          if ! git diff --quiet -- data/summary.json data/study_stats.json data/facets.json; then
            echo "::error::Derived data files are stale. Run: py scripts/validate_and_update.py <ID> --data-dir data and commit the result."
            git diff --stat -- data/summary.json data/study_stats.json data/facets.json
            exit 1
          fi
          echo "Derived files up to date"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Runs after the derived-file check so a stale summary.json is reported by
      # its own step rather than as a confusing footer-date diff here.
      - name: Check static header, footer and study grids are current
        run: |
          if ! node scripts/build_static.js --check; then
            echo "::error::Static HTML blocks are stale (pages listed above). Run: node scripts/build_static.js  and commit the changed .html files."
            exit 1
          fi
          echo "Static HTML blocks up to date"
