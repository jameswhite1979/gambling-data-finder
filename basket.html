    display: grid;

    grid-column: 1 / -1;

  @media (max-width: 900px) {
    .basket-grid {
      grid-template-columns: 1fr;
    }
    .basket-grid > .basket-section:last-child {
      grid-column: auto;
    }
  }
  .basket-bottom {
    margin-top: 2rem;
    text-align: center;
    padding-bottom: 1rem;
  }
  .basket-item {
    align-items: flex-start;
  }
  .basket-item-content {
    min-width: 0;
  }
  .basket-detail-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

  .basket-detail {
    min-width: 0;

  }
  .basket-detail dd {
    margin: 0;

<div class="basket-banner">
  <div class="basket-banner-inner">This is your active list.</div>
</div>

<div id="main-content" class="page-content">
  <div id="basket-page">
    <div class="loading" id="basket-loading">Loading your list...</div>
  </div>
</div>

<script>document.body.insertAdjacentHTML('beforeend', renderFooter());</script>

<script>
var basketContext = {
  datasets: {},
  access: {},
  sources: {}
};

document.addEventListener('DOMContentLoaded', function () {
  updateBasketCount();
  loadBasketContext().then(renderBasketPage);
});

async function loadBasketContext() {
  try {
    var datasets = await fetchJSON('data/datasets.json') || [];
    var access = await fetchJSON('data/access.json') || [];
    var sources = await fetchJSON('data/sources.json') || [];
    datasets.forEach(function (d) { basketContext.datasets[d['Dataset_ID']] = d; });
    access.forEach(function (a) { basketContext.access[a['Dataset_ID']] = a; });
    sources.forEach(function (s) {
      var id = s['Dataset_ID'];
      if (!basketContext.sources[id]) basketContext.sources[id] = [];
      basketContext.sources[id].push(s);
    });
  } catch (e) {
    console.warn('Unable to load basket context', e);
  }
}

function renderBasketPage() {
  const container = document.getElementById('basket-page');
  const basket = getBasket();

  if (basket.length === 0) {
    container.innerHTML =
      '<div class="basket-empty">' +
        '<p>Your list is empty.</p>' +
        '<p style="margin-top:.5rem;font-size:.9rem;">Use the <a href="search.html">search page</a> to find variables, questions and questionnaires for evidence mapping or data access planning, then add them to your list.</p>' +
      '</div>';
    return;
  }

  const grouped = getBasketGrouped();
  let html = '<div class="basket-grid">';
  html += buildSection('variable', 'Variables', grouped.variables);
  html += buildSection('question', 'Questions', grouped.questions);
  html += buildSection('questionnaire', 'Questionnaires', grouped.questionnaires);
  html += '</div>';
  html += '<div class="basket-bottom"><button class="btn btn-danger" onclick="doClearAll()">Clear all</button></div>';
  container.innerHTML = html;
}

function buildSection(type, label, items) {
  var count = items.length;
  var html = '<div class="basket-section" id="section-' + type + '">';
  html += '<div class="basket-section-header">';
  html += '<h3>' + escapeHTML(label) + ' (' + count + ')</h3>';
  if (count > 0) {
    html += '<div class="dropdown">';
    html += '<button class="btn btn-primary btn-sm dropdown-btn" onclick="toggleDropdown(this)">Download Metadata &#9662;</button>';
    html += '<div class="dropdown-menu">';
    html += '<button class="dropdown-item" onclick="doDownloadCSV(\'' + type + '\')">CSV</button>';
    html += '<button class="dropdown-item" onclick="doDownloadExcel(\'' + type + '\')">Excel</button>';
    html += '<button class="dropdown-item" onclick="doDownloadPDF(\'' + type + '\')">PDF Codebook</button>';
    html += '<button class="dropdown-item" onclick="doDownloadDDI(\'' + type + '\')">DDI Codebook (XML)</button>';
    html += '</div></div>';
  }
  html += '</div>';
  html += '<div class="basket-section-body">';
  if (count === 0) {
    html += '<div class="basket-empty" style="padding:1.5rem;"><p>No ' + label.toLowerCase() + ' in your list.</p></div>';
  } else {
    items.forEach(function (item) {
      var globalIdx = getGlobalIndex(item);
      html += renderBasketItem(item, globalIdx, type);
    });
  }
  html += '</div></div>';
  return html;
}

function getGlobalIndex(item) {
  var basket = getBasket();
  var key = basketKey(item);
  for (var i = 0; i < basket.length; i++) {
    if (basketKey(basket[i]) === key) return i;
  }
  return -1;
}

function renderBasketItem(item, globalIdx, type) {
  var title = '';
  var meta = '';

  if (type === 'variable') {
    title = escapeHTML(item.variable_label || item.variable_name || '(no label)');
    meta = buildMetaLine(item);
  } else if (type === 'question') {
    title = escapeHTML(item.question_text || item.variable_label || item.title || '(no question text)');
    meta = buildMetaLine(item);
  } else {
    title = escapeHTML(item.title || item.questionnaire_name || item.named_measure || '(untitled)');
    meta = buildMetaLine(item);
  }

  var html = '<div class="basket-item">';
  html += '<input type="checkbox" class="basket-item-check" checked data-idx="' + globalIdx + '">';
  html += '<div class="basket-item-content">';
  html += '<div class="basket-item-title">' + title + '</div>';
  html += '<div class="basket-item-meta">' + meta + '</div>';
  html += renderItemDetails(item, type);
  html += '</div>';
  html += '<button class="basket-item-remove" onclick="doRemove(' + globalIdx + ')" title="Remove from list">&times;</button>';
  html += '</div>';
  return html;
}

function valueOrDash(value) {
  value = (value === undefined || value === null) ? '' : String(value).trim();
  return value || 'Not extracted';
}

function linkOrText(value) {
  value = (value === undefined || value === null) ? '' : String(value).trim();
  if (!value) return 'Not extracted';
  if (/^https?:\/\//i.test(value)) {
    return '<a href="' + escapeHTML(value) + '" target="_blank" rel="noopener">' + escapeHTML(truncate(value, 80)) + '</a>';
  }
  return escapeHTML(value);
}

function detailBlock(label, value, isUrl, wide) {
  return '<dl class="basket-detail' + (wide ? ' basket-detail-wide' : '') + '">' +
    '<dt>' + escapeHTML(label) + '</dt>' +
    '<dd>' + (isUrl ? linkOrText(value) : escapeHTML(valueOrDash(value))) + '</dd>' +
    '</dl>';
}

function getDatasetRecord(item) {
  return basketContext.datasets[item.dataset_id] || {};
}

function getAccessRecord(item) {
  return basketContext.access[item.dataset_id] || {};
}

function getPrimarySourceUrl(item) {
  var sources = basketContext.sources[item.dataset_id] || [];
  var preferred = sources.find(function (s) {
    return /variable|catalogue|metadata|questionnaire/i.test(s['Resource type'] || s['Title / description'] || '');
  }) || sources[0] || {};
  return preferred.URL || '';
}

function getAccessUrl(item) {
  var access = getAccessRecord(item);
  var ds = getDatasetRecord(item);
  return item.access_url ||
    access['Access request URL'] ||
    ds['Access request URL'] ||
    access['Data access documentation URL'] ||
    ds['Dataset/home URL'] ||
    item.variable_url ||
    item.questionnaire_url ||
    '';
}

function getQuestionnaireTitle(item) {
  return item.questionnaire_title ||
    item.questionnaire_name ||
    item.questionnaire ||
    item.questionnaire_url ||
    item['Questionnaire / codebook URL'] ||
    '';
}

function renderItemDetails(item, type) {
  if (type !== 'variable' && type !== 'question') return '';
  var access = getAccessRecord(item);
  var html = '<div class="basket-detail-grid">';
  html += detailBlock('Name', item.variable_name || item['Variable/item ID'], false, false);
  html += detailBlock('Label', item.variable_label || item['Variable label or exact question'], false, false);
  html += detailBlock('Question', item.question_text || item.variable_label || item['Variable label or exact question'], false, true);
  html += detailBlock('Dataset', item.dataset_name || item.dataset_id, false, false);
  html += detailBlock('Wave / age', [item.wave_year, item.age_group].filter(Boolean).join(' / '), false, false);
  html += detailBlock('Response categories', item.response_options || item.value_labels || item.response_categories, false, true);
  html += detailBlock('Questionnaire / codebook', getQuestionnaireTitle(item), true, true);
  html += detailBlock('Variable metadata URL', item.variable_url, true, true);
  html += detailBlock('Data access URL', getAccessUrl(item), true, true);
  if (access['Access route'] || access['Access status']) {
    html += detailBlock('Access route', access['Access route'] || access['Access status'], false, false);
  }
  if (item.metadata_status) {
    html += detailBlock('Metadata status', item.metadata_status, false, false);
  }
  html += '</div>';
  return html;
}

function buildMetaLine(item) {
  var parts = [];
  if (item.dataset_name || item.dataset_id) {
    var studyLabel = escapeHTML(item.dataset_name || item.dataset_id);
    parts.push('Study: <a href="study.html?id=' + encodeURIComponent(item.dataset_id || '') + '">' + studyLabel + '</a>');
  }
  if (item.wave_year) {
    parts.push('Wave: ' + escapeHTML(item.wave_year));
  }
  if (item.variable_name && item.item_type !== 'questionnaire') {
    parts.push('Var: ' + escapeHTML(item.variable_name));
  }
  if (item.named_measure) {
    parts.push('Measure: ' + escapeHTML(item.named_measure));
  }
  if (item.role) {
    parts.push('Role: ' + escapeHTML(item.role));
  }
  return parts.join(' &middot; ');
}

function doRemove(idx) {
  removeFromBasket(idx);
  renderBasketPage();
}

function doClearAll() {
  if (confirm('Remove all items from your list?')) {
    clearBasket();
    renderBasketPage();
  }
}

/* ---- Download helpers ---- */

function getCheckedItems(type) {
  var grouped = getBasketGrouped();
  var items;
  if (type === 'variable') items = grouped.variables;
  else if (type === 'question') items = grouped.questions;
  else items = grouped.questionnaires;

  var section = document.getElementById('section-' + type);
  if (!section) return items;

  var checkboxes = section.querySelectorAll('.basket-item-check');
  var checked = [];
  for (var i = 0; i < checkboxes.length; i++) {
    if (checkboxes[i].checked && items[i]) {
      checked.push(items[i]);
    }
  }
  return checked.length > 0 ? checked : items;
}

function doDownloadCSV(type) {
  var items = getCheckedItems(type);
  if (!items.length) return;
  downloadCSV(items.map(function (item) { return normaliseExportRow(item, type); }), 'ghripps_' + type + 's.csv');
}

function doDownloadExcel(type) {
  var items = getCheckedItems(type);
  if (!items.length) return;
  downloadExcel(items.map(function (item) { return normaliseExportRow(item, type); }), 'ghripps_' + type + 's.xlsx');
}

/* ---- DDI-Codebook 2.5 export ---- */

function xmlEscape(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, ' ')   // strip chars illegal in XML 1.0
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

/* Best-effort split of a free-text response list into DDI <catgry> pairs.
   Handles "1=Yes; 2=No", "1. Yes", "1) No", "1 - Maybe" and plain comma lists. */
function parseCategories(text) {
  text = String(text || '').trim();
  if (!text) return [];
  var parts = text.split(/\s*;\s*|\r?\n/).map(function (p) { return p.trim(); }).filter(Boolean);
  if (parts.length <= 1) {
    var byComma = text.split(/\s*,\s*/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (byComma.length > 1) parts = byComma;
  }
  return parts.map(function (p) {
    var m = p.match(/^\s*(-?\d+)\s*(?:=|\.|\)|:|\s-\s)\s*(.+)$/);
    if (m) return { value: m[1], label: m[2].trim() };
    return { value: null, label: p };
  });
}

function ddiNotes(item) {
  var notes = [];
  function push(label, val) {
    val = (val === undefined || val === null) ? '' : String(val).trim();
    if (val) notes.push(label + ': ' + val);
  }
  push('Study', item.dataset_name || item.dataset_id);
  push('Dataset ID', item.dataset_id);
  push('Wave', item.wave_year);
  push('Age group', item.age_group);
  push('Role', item.role);
  push('Named measure', item.named_measure);
  push('Category', item.construct_category);
  push('How to access the data', accessRouteText(item));
  push('Data access URL', getAccessUrl(item));
  push('Access notes', accessNotesText(item));
  push('Variable metadata URL', item.variable_url);
  push('Questionnaire / codebook', getQuestionnaireTitle(item));
  return notes.join('; ');
}

function buildDDIXML(items, type) {
  var dateStr = new Date().toISOString().slice(0, 10);
  var label = type.charAt(0).toUpperCase() + type.slice(1) + 's';
  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  xml += '<codeBook xmlns="ddi:codebook:2_5" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" ' +
         'xsi:schemaLocation="ddi:codebook:2_5 https://ddialliance.org/Specification/DDI-Codebook/2.5/XMLSchema/codebook.xsd" version="2.5">\n';

  xml += '  <docDscr>\n    <citation>\n';
  xml += '      <titlStmt><titl>' + xmlEscape(label + ' metadata export') + '</titl></titlStmt>\n';
  xml += '      <prodStmt><producer>Gambling Data Finder</producer>' +
         '<prodDate date="' + dateStr + '">' + dateStr + '</prodDate></prodStmt>\n';
  xml += '    </citation>\n  </docDscr>\n';

  xml += '  <stdyDscr>\n    <citation>\n';
  xml += '      <titlStmt><titl>' + xmlEscape('Selected ' + type + 's (' + items.length + ')') + '</titl></titlStmt>\n';
  xml += '    </citation>\n';
  xml += '    <stdyInfo><abstract>' +
         xmlEscape('Variable- and question-level metadata exported from the Gambling Data Finder for evidence mapping and data access planning. Each item retains its source study, wave and data-access route.') +
         '</abstract></stdyInfo>\n';
  xml += '  </stdyDscr>\n';

  if (type === 'questionnaire') {
    items.forEach(function (item, i) {
      var uri = item.questionnaire_url || getAccessUrl(item) || '';
      xml += '  <otherMat type="questionnaire"' + (uri ? ' URI="' + xmlEscape(uri) + '"' : '') + '>\n';
      xml += '    <labl>' + xmlEscape(pdfTitleForItem(item, type)) + '</labl>\n';
      var n = ddiNotes(item);
      if (n) xml += '    <notes>' + xmlEscape(n) + '</notes>\n';
      xml += '  </otherMat>\n';
    });
  } else {
    xml += '  <dataDscr>\n';
    items.forEach(function (item, i) {
      var name = item.variable_name || item['Variable/item ID'] || ('item' + (i + 1));
      xml += '    <var ID="v' + (i + 1) + '" name="' + xmlEscape(name) + '">\n';
      var labl = item.variable_label || item['Variable label or exact question'] || item.question_text || '';
      if (labl) xml += '      <labl>' + xmlEscape(labl) + '</labl>\n';
      var qtext = item.question_text || item.variable_label || '';
      if (qtext) xml += '      <qstn><qstnLit>' + xmlEscape(qtext) + '</qstnLit></qstn>\n';
      parseCategories(item.response_options || item.value_labels || item.response_categories).forEach(function (c) {
        xml += '      <catgry>';
        if (c.value !== null && c.value !== undefined) xml += '<catValu>' + xmlEscape(c.value) + '</catValu>';
        xml += '<labl>' + xmlEscape(c.label) + '</labl></catgry>\n';
      });
      var n = ddiNotes(item);
      if (n) xml += '      <notes>' + xmlEscape(n) + '</notes>\n';
      xml += '    </var>\n';
    });
    xml += '  </dataDscr>\n';
  }

  xml += '</codeBook>\n';
  return xml;
}

function doDownloadDDI(type) {
  var items = getCheckedItems(type);
  if (!items.length) return;
  downloadBlob(buildDDIXML(items, type), 'ghripps_' + type + 's_ddi.xml', 'application/xml;charset=utf-8;');
}

function normaliseExportRow(item, type) {
  var access = getAccessRecord(item);
  var ds = getDatasetRecord(item);
  return {
    item_type: type,
    dataset_id: item.dataset_id || '',
    dataset_name: item.dataset_name || ds['Dataset name'] || '',
    wave_year: item.wave_year || '',
    age_group: item.age_group || '',
    variable_name: item.variable_name || item['Variable/item ID'] || '',
    variable_label: item.variable_label || item['Variable label or exact question'] || '',
    question_text: item.question_text || item.variable_label || item['Variable label or exact question'] || '',
    response_categories: item.response_options || item.value_labels || item.response_categories || '',
    questionnaire: getQuestionnaireTitle(item),
    questionnaire_url: item.questionnaire_url || '',
    construct_category: item.construct_category || '',
    named_measure: item.named_measure || '',
    role: item.role || '',
    risk_domain: item.risk_domain || '',
    timing: item.timing || '',
    variable_metadata_url: item.variable_url || '',
    access_url: getAccessUrl(item),
    access_route: access['Access route'] || access['Access status'] || item.access_type || ds['Access type'] || '',
    access_notes: access['Data format / notes'] || access.Notes || ds['Notes / uncertainties'] || '',
    source_url: getPrimarySourceUrl(item),
    metadata_status: item.metadata_status || '',
    meta_analysis_note: item.meta_analysis_note || ''
  };
}

/* Lazily load the jsPDF UMD bundle so the codebook downloads as a real .pdf.
   Resolves with the jsPDF constructor; rejects if the CDN is unreachable. */
var _jsPDFPromise = null;
function ensureJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (_jsPDFPromise) return _jsPDFPromise;
  _jsPDFPromise = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
    s.onload = function () {
      if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
      else reject(new Error('jsPDF loaded but constructor not found'));
    };
    s.onerror = function () { reject(new Error('Failed to load jsPDF')); };
    document.head.appendChild(s);
  });
  return _jsPDFPromise;
}

function accessRouteText(item) {
  var access = getAccessRecord(item);
  var ds = getDatasetRecord(item);
  return access['Access route'] || access['Access status'] || item.access_type || ds['Access type'] || '';
}

function accessNotesText(item) {
  var access = getAccessRecord(item);
  var ds = getDatasetRecord(item);
  return access['Data format / notes'] || access.Notes || ds['Notes / uncertainties'] || '';
}

function pdfTitleForItem(item, type) {
  if (type === 'variable') return item.variable_label || item.variable_name || '(no label)';
  if (type === 'question') return item.question_text || item.variable_label || item.title || '(no question text)';
  return item.title || item.questionnaire_name || item.named_measure || '(untitled)';
}

/* Ordered [label, value] pairs shown per item; empties are dropped. */
function pdfFieldsForItem(item, type) {
  var fields = [];
  function add(label, val) {
    val = (val === undefined || val === null) ? '' : String(val).trim();
    if (val) fields.push([label, val]);
  }
  if (type === 'variable' || type === 'question') {
    add('Variable', item.variable_name || item['Variable/item ID']);
    add('Study', item.dataset_name || item.dataset_id);
    add('Wave / age', [item.wave_year, item.age_group].filter(Boolean).join(' / '));
    if (type === 'question') add('Question', item.question_text || item.variable_label);
    add('Role', item.role);
    add('Named measure', item.named_measure);
    add('Category', item.construct_category);
    add('Response categories', item.response_options || item.value_labels || item.response_categories);
  } else {
    add('Study', item.dataset_name || item.dataset_id);
    add('Wave', item.wave_year);
    add('Named measure', item.named_measure);
  }
  /* How to get the data — the point of this export. */
  add('How to access the data', accessRouteText(item));
  add('Data access URL', getAccessUrl(item));
  add('Access notes', accessNotesText(item));
  add('Variable metadata URL', item.variable_url);
  add('Questionnaire / codebook', getQuestionnaireTitle(item));
  return fields;
}

function doDownloadPDF(type) {
  var items = getCheckedItems(type);
  if (!items.length) return;
  var label = type.charAt(0).toUpperCase() + type.slice(1) + 's';

  ensureJsPDF().then(function (JsPDF) {
    var doc = new JsPDF({ unit: 'pt', format: 'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 40;
    var maxW = pageW - margin * 2;
    var y = margin;

    function ensureSpace(h) {
      if (y + h > pageH - margin) { doc.addPage(); y = margin; }
    }
    function writeWrapped(text, size, style, color) {
      doc.setFont('helvetica', style || 'normal');
      doc.setFontSize(size);
      doc.setTextColor(color === undefined ? 0 : color);
      var lines = doc.splitTextToSize(String(text), maxW);
      var lh = size * 1.3;
      for (var i = 0; i < lines.length; i++) {
        ensureSpace(lh);
        doc.text(lines[i], margin, y);
        y += lh;
      }
    }
    /* Bold "Label: " lead-in with a normal, wrapped value. */
    function writeField(labelText, valueText) {
      var size = 9.5, lh = size * 1.3, indent = 8, x0 = margin + indent;
      doc.setFontSize(size);
      var prefix = labelText + ': ';
      doc.setFont('helvetica', 'bold');
      var prefixW = doc.getTextWidth(prefix);
      var lines = doc.splitTextToSize(String(valueText), maxW - indent - prefixW);
      if (!lines.length) lines = [''];
      for (var i = 0; i < lines.length; i++) {
        ensureSpace(lh);
        if (i === 0) {
          doc.setFont('helvetica', 'bold'); doc.setTextColor(70);
          doc.text(prefix, x0, y);
          doc.setFont('helvetica', 'normal'); doc.setTextColor(30);
          doc.text(lines[0], x0 + prefixW, y);
        } else {
          doc.setFont('helvetica', 'normal'); doc.setTextColor(30);
          doc.text(lines[i], x0, y);
        }
        y += lh;
      }
    }

    writeWrapped(label + ' Codebook', 18, 'bold', 20);
    y += 4;
    writeWrapped(items.length + ' item(s) exported from the Gambling Data Finder', 10, 'normal', 110);
    y += 12;

    items.forEach(function (item) {
      ensureSpace(48);
      writeWrapped(pdfTitleForItem(item, type), 12, 'bold', 15);
      y += 2;
      pdfFieldsForItem(item, type).forEach(function (pair) {
        writeField(pair[0], pair[1]);
      });
      y += 10;
      ensureSpace(12);
      doc.setDrawColor(220);
      doc.line(margin, y, pageW - margin, y);
      y += 12;
    });

    doc.save('ghripps_' + type + 's_codebook.pdf');
  }).catch(function (err) {
    console.warn('PDF download unavailable (offline?), opening printable view instead', err);
    printCodebookFallback(type, items);
  });
}

/* Fallback used only if jsPDF cannot load: opens a printable tab. */
function printCodebookFallback(type, items) {
  var label = type.charAt(0).toUpperCase() + type.slice(1) + 's';
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8">';
  html += '<title>' + escapeHTML(label) + ' Codebook — Gambling Data Finder</title>';
  html += '<style>';
  html += 'body{font-family:"Segoe UI",system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1.5rem;color:#1a1a2e;line-height:1.5}';
  html += 'h1{font-size:1.4rem;border-bottom:2px solid #d97706;padding-bottom:.4rem;margin-bottom:1.5rem}';
  html += '.item{margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid #e2e8f0}';
  html += '.item-title{font-weight:700;font-size:1rem;color:#0f172a}';
  html += '.item-meta{font-size:.85rem;color:#64748b;margin-top:.25rem}';
  html += '.item-meta div{margin-top:.15rem}';
  html += '@media print{body{margin:0;padding:1cm} .no-print{display:none}}';
  html += '</style></head><body>';
  html += '<h1>' + escapeHTML(label) + ' Codebook</h1>';
  html += '<p style="font-size:.85rem;color:#64748b;margin-bottom:1.5rem">' + items.length + ' item(s) exported from the Gambling Data Finder</p>';

  items.forEach(function (item) {
    html += '<div class="item">';
    html += '<div class="item-title">' + escapeHTML(pdfTitleForItem(item, type)) + '</div>';
    html += '<div class="item-meta">';
    pdfFieldsForItem(item, type).forEach(function (pair) {
      html += '<div><strong>' + escapeHTML(pair[0]) + ':</strong> ' + escapeHTML(pair[1]) + '</div>';
    });
    html += '</div></div>';
  });

  html += '<p class="no-print" style="margin-top:2rem;text-align:center"><button onclick="window.print()" style="padding:.5rem 1.5rem;font-size:.9rem;cursor:pointer">Print / Save as PDF</button></p>';
  html += '</body></html>';

  var win = window.open('', '_blank');
  if (win) {
    win.document.write(html);
    win.document.close();
  }
}
</script>
