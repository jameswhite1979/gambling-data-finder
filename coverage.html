<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataset Coverage — Gambling Data Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=5">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Metadata coverage and documentation status for each study in the Gambling Data Finder.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gambling Data Finder">
<meta property="og:title" content="Dataset Coverage — Gambling Data Finder">
<meta property="og:description" content="Metadata coverage and documentation status for each study in the Gambling Data Finder.">
<meta property="og:url" content="https://jameswhite1979.github.io/gambling-data-finder/coverage.html">
<meta property="og:image" content="https://jameswhite1979.github.io/gambling-data-finder/assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="header"></div>

<div class="coverage-wide">
  <h1 style="font-size:1.4rem;color:var(--navy);margin-bottom:.3rem;">Dataset coverage</h1>
  <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;">Overview of what metadata is available for each study or dataset relevant to children and young people's gambling harm research. Use this to identify data access routes, extracted measures and gaps for further review.</p>

  <div class="coverage-wrapper">
    <div id="coverage-content"><div class="loading">Loading coverage data...</div></div>
  </div>
</div>

<div id="footer"></div>
<script src="app.js?v=6"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('header').innerHTML = renderNav('coverage');
  document.getElementById('footer').innerHTML = renderFooter();
  updateBasketCount();

  // Counts come from the small precomputed study_stats.json
  const [datasets, stats, metaCheck] = await Promise.all([
    fetchJSON('data/datasets.json'),
    fetchJSON('data/study_stats.json'),
    fetchJSON('data/metadata_check.json'),
  ]);

  if (!datasets) { document.getElementById('coverage-content').innerHTML = '<p>Unable to load data.</p>'; return; }

  const varCounts = {}, gambCounts = {}, qCounts = {}, srcCounts = {};
  Object.keys(stats || {}).forEach(id => {
    varCounts[id] = stats[id].variables || 0;
    gambCounts[id] = stats[id].gambling || 0;
    qCounts[id] = stats[id].questionnaires || 0;
    srcCounts[id] = stats[id].sources || 0;
  });

  const metaMap = {};
  (metaCheck||[]).forEach(m => { metaMap[m['Dataset_ID']] = m; });

  const sorted = datasets.sort((a,b) => (a['Dataset name']||'').localeCompare(b['Dataset name']||''));

  let html = `<table class="coverage-table">
    <thead><tr>
      <th scope="col">Dataset</th>
      <th scope="col">Country</th>
      <th scope="col">Design</th>
      <th scope="col">Age group</th>
      <th scope="col">Variables</th>
      <th scope="col">Gambling measures</th>
      <th scope="col">Questionnaires</th>
      <th scope="col">Sources</th>
      <th scope="col">Variable names</th>
      <th scope="col">Documentation</th>
      <th scope="col">Access</th>
    </tr></thead><tbody>`;

  sorted.forEach(d => {
    const id = d['Dataset_ID'];
    const mc = metaMap[id] || {};
    const nv = varCounts[id] || 0;
    const ng = gambCounts[id] || 0;
    const nq = qCounts[id] || 0;
    const ns = srcCounts[id] || 0;

    function tick(val) {
      if (!val) return '<span class="cov-no">—</span>';
      const v = val.toLowerCase();
      if (v.startsWith('yes')) return '<span class="cov-yes">Yes</span>';
      if (v.startsWith('partial')) return '<span class="cov-partial">Partial</span>';
      return '<span class="cov-no">' + escapeHTML(val) + '</span>';
    }

    html += `<tr>
      <td><a href="study.html?id=${encodeURIComponent(id)}" style="color:var(--amber);font-weight:600;">${escapeHTML(d['Dataset name']||id)}</a></td>
      <td>${escapeHTML(d['Country']||'')}</td>
      <td>${escapeHTML(d['Study design']||'')}</td>
      <td>${escapeHTML(d['Age focus / population']||'')}</td>
      <td class="cov-num" style="font-weight:600;">${nv ? nv.toLocaleString() : '<span class="cov-no">0</span>'}</td>
      <td class="cov-num" style="font-weight:600;">${ng ? ng.toLocaleString() : '<span class="cov-no">0</span>'}</td>
      <td class="cov-num">${nq || '<span class="cov-no">0</span>'}</td>
      <td class="cov-num">${ns || '<span class="cov-no">0</span>'}</td>
      <td>${tick(mc['Variable names public?'])}</td>
      <td>${tick(mc['Question wording public?'])}</td>
      <td style="font-size:.72rem;">${escapeHTML(d['Access difficulty']||d['Access type']||'')}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('coverage-content').innerHTML = html;
});
</script>
</body>
</html>
